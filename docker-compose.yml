services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: jsport
      POSTGRES_PASSWORD: jsport
      POSTGRES_DB: jsport
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jsport"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://jsport:jsport@db:5432/jsport
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-0000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    ports: ["8000:8000"]
    volumes: [media:/app/media]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  media:
